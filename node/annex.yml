# Node with pnpm and TypeScript.
# check: node -v && pnpm -v && tsc -v && git --version
name: node
description: Node, npm, pnpm, TypeScript and git
vcpu: 2
memory_gib: 4
route: cheapest
setup:
  - |
    S=; [ "$(id -u)" = 0 ] || S=sudo
    $S apt-get update && $S env DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs npm git
  - |
    S=; [ "$(id -u)" = 0 ] || S=sudo
    $S npm install -g pnpm typescript
